name: patch-app-hourly-mean-fix
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: patch-app
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Write patch script
        run: echo "" | base64 -d > /tmp/patch_app3.py
      - name: Apply patch
        run: python3 /tmp/patch_app3.py
      - name: Commit
        run: |
          git config user.name "vayudrishti-bot"
          git config user.email "bot@vayudrishti.github.io"
          git add app/index.html
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "app: fix 6-hourly summary temps - average, not sum"
          git pull --rebase
          git push
