name: rebuild-world-extra
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - run: pip install numpy eccodes numcodecs
      - name: build extra days at the full 1M grid (chunk 128)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p wa && cd wa
          for f in pointsw1m.json.gz cellsw1m.json.gz vdlibw.py gfs013_lats.json rebuild_chunkw.py; do
            gh release download world-assets --repo $GITHUB_REPOSITORY --pattern "$f" --clobber --dir .
          done
          gunzip -f pointsw1m.json.gz cellsw1m.json.gz
          sed -i "s/date>='2021-03-23'/date>='2021-03-22'/" vdlibw.py
          grep -n "atmos/" vdlibw.py | head -2
          echo '["2021-03-24","2022-11-30","2022-12-01"]' > alld_extra.json
          VD_POINTS=pointsw1m.json VD_CELLS=cellsw1m.json python3 rebuild_chunkw.py alld_extra.json 0 3 /tmp/out data-days-world 128
