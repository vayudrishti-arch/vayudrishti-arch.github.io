name: world-setup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy eccodes
      - name: generate worldwide grid + day list, upload assets to world-assets release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 world/gridgen_actions.py
          gh release view world-assets --repo $GITHUB_REPOSITORY || gh release create world-assets --repo $GITHUB_REPOSITORY --title 'Worldwide grid assets' --notes 'pointsw/cellsw (0.125-deg worldwide land grid), alld_world.json day list, gfs013_lats.json, pipeline scripts.'
          gh release upload world-assets pointsw.json.gz cellsw.json.gz alld_world.json --clobber --repo $GITHUB_REPOSITORY
          gh release upload world-assets /tmp/rb/gfs013_lats.json world/vdlibw.py world/rebuild_chunkw.py --clobber --repo $GITHUB_REPOSITORY
