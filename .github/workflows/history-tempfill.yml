name: history-tempfill
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tempfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: fill missing 2021-2022 observed temps
        run: python3 history/tempfill.py
      - name: commit
        run: |
          git config user.name "vayudrishti-nightly"
          git config user.email "actions@users.noreply.github.com"
          git add app/history
          if ! git diff --cached --quiet; then git commit -m "history: fill missing 2021-2022 observed temps"; git pull --rebase -q; git push; fi
