name: patch-app-history-panel
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: add device-local run history panel script (hash-verified)
        run: |
          echo '' | base64 -d > /tmp/patch_hist.py
          echo '' | base64 -d > /tmp/hist.js.b64src
          python3 /tmp/patch_hist.py "$(cat /tmp/hist.js.b64src)"
      - name: commit
        run: |
          git config user.name "vayudrishti-nightly"
          git config user.email "actions@users.noreply.github.com"
          git add app/index.html
          if ! git diff --cached --quiet; then git commit -m "app: device-local run history panel with ERA5 comparison (user-approved Nov 2)"; git pull --rebase -q; git push; fi
