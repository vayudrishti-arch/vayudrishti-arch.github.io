name: patch-app-note-strip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: apply ERA5-lag note + rest-of-today hourly strip
        run: |
          echo '' | base64 -d > /tmp/patch_app.py
          python3 /tmp/patch_app.py
      - name: commit
        run: |
          git config user.name "vayudrishti-nightly"
          git config user.email "actions@users.noreply.github.com"
          git add app/index.html
          if ! git diff --cached --quiet; then git commit -m "app: ERA5 5-day-late note + rest-of-today hourly raw GFS strip"; git pull --rebase -q; git push; fi
