name: nightly-learning
on:
  schedule:
    - cron: '30 21 * * *'   # 03:00 IST
  workflow_dispatch:
    inputs:
      rollback:
        description: 'Leave empty for a normal run. "prev" = restore previous promoted model, "embedded" = remove the promoted model so the site uses the model built into index.html'
        required: false
        default: ''
permissions:
  contents: write
  issues: write
concurrency:
  group: nightly-learning
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install numpy "xgboost>=3.0" ecmwflibs eccodes numcodecs
      - name: Nightly run (promotion is controlled by nightly/PROMOTE)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          P=$(tr -d ' \n' < nightly/PROMOTE)
          if [ -n "$ROLLBACK" ]; then python3 nightly/run.py --promote=$P --rollback=$ROLLBACK; else python3 nightly/run.py --promote=$P; fi
      - name: Save results
        if: always()
        run: |
          git config user.name "vayudrishti-nightly"
          git config user.email "actions@users.noreply.github.com"
          git add nightly/status.json nightly/candidate-lead1.json app/lead1-model.json app/lead1-model.prev.json 2>/dev/null || true
          git add -A app nightly
          if ! git diff --cached --quiet; then git commit -m "nightly: $(date -u +%F) result"; git pull --rebase -q; git push; fi
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "VayuDrishti nightly run failed $(date -u +%F)" --body "The nightly learning run failed. Current model is unchanged. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
