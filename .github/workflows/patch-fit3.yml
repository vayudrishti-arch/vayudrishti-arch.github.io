name: patch-fit3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write patched fit_world3.py
        run: |
          echo '' | base64 -d > world/fit_world3.py
          python3 -c "import ast;ast.parse(open('world/fit_world3.py').read())"
      - name: commit and push
        run: |
          git config user.email actions@github.com
          git config user.name github-actions
          git add world/fit_world3.py
          git commit -m "fit_world3: chunk-paired pass-1 streaming (memory/cancel fix)"
          git push
