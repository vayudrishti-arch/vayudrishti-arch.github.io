name: fit-world-l3-v4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy xgboost scikit-learn
      - name: worldwide lead-3 richer-features fit v4 (v6-style spatial; abstain where OOF harm >3%) + gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VD_LEAD: '3'
          VD_TAG: data-days-world-l3
          VD_OUT: world-fit-l3-v4
        run: python3 world/fit_worldl4.py
