name: history6h-fill
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'first date to fill (YYYY-MM-DD)'
        required: true
      end:
        description: 'last date to fill (YYYY-MM-DD)'
        required: true
      chain_end:
        description: 'optional final date; after this chunk, dispatch the next chunk until chain_end is covered'
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  group: history6h-fill
  cancel-in-progress: false
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy eccodes
      - name: fill missing backtrack days (never overwrites existing rows)
        run: python3 history/hourly_fill.py "${{ inputs.start }}" "${{ inputs.end }}"
      - name: commit history files
        run: |
          git config user.name "vayudrishti-nightly"
          git config user.email "actions@users.noreply.github.com"
          git add app/history6h
          if ! git diff --cached --quiet; then git commit -m "history6h: hourly fill ${{ inputs.start }}..${{ inputs.end }}"; git pull --rebase -q; git push; fi
      - name: dispatch next chunk
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,sys,datetime,json,urllib.request
          start="${{ inputs.start }}"; end="${{ inputs.end }}"; chain="${{ inputs.chain_end }}"
          if not chain:
              print("no chain_end; single chunk done"); sys.exit(0)
          s=datetime.date.fromisoformat(start); e=datetime.date.fromisoformat(end); c=datetime.date.fromisoformat(chain)
          if e>=c:
              print("chain complete at",end); sys.exit(0)
          span=(e-s).days+1
          ns=e+datetime.timedelta(days=1); ne=min(e+datetime.timedelta(days=span),c)
          repo=os.environ["GITHUB_REPOSITORY"]
          body=json.dumps({"ref":"main","inputs":{"start":str(ns),"end":str(ne),"chain_end":str(c)}}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/workflows/history6h-fill.yml/dispatches",
              data=body,method="POST",
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"history6h-chain"})
          try:
              r=urllib.request.urlopen(req); print("dispatched next chunk",ns,"..",ne,"http",r.status)
          except urllib.error.HTTPError as ex:
              print("NEXT-CHUNK DISPATCH FAILED http",ex.code,ex.read().decode()[:500]); sys.exit(1)
          PY
