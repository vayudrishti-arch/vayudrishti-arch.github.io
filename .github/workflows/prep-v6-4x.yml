# One-off prep: make fit_world3.py strides + output tag env-configurable (defaults keep
# current behaviour), (the trial workflow itself is committed via the web editor: GITHUB_TOKEN may not
# create workflow files).
# Requested by the user Oct 22, 2026 ~5:15 PM IST (24h longer-window trial, research only).
name: prep-v6-4x
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fit_world3.py
        run: |
          set -e
          python3 - <<'PY'
          p='world/fit_world3.py'; s=open(p).read()
          r1o='FIT_DAY_STRIDE=16;FIT_POINT_STRIDE=4'
          r1n="FIT_DAY_STRIDE=int(os.environ.get('VD_DAY_STRIDE','16'));FIT_POINT_STRIDE=int(os.environ.get('VD_POINT_STRIDE','4'))"
          assert s.count(r1o)==1, s.count(r1o)
          s=s.replace(r1o,r1n)
          assert s.count("'world-fit-v6'")==4, s.count("'world-fit-v6'")
          s=s.replace("'world-fit-v6'","os.environ.get('VD_OUT','world-fit-v6')")
          assert s.count("os.environ.get('VD_OUT','world-fit-v6')")==4, s.count("os.environ.get('VD_OUT','world-fit-v6')")
          open(p,'w').write(s)
          print('patched fit_world3.py')
          PY
      - name: Commit
        run: |
          git config user.name "vayudrishti-bot"
          git config user.email "bot@vayudrishti.local"
          git add world/fit_world3.py
          git diff --cached --quiet || git commit -m "fit_world3.py: env-configurable strides + output tag (defaults unchanged)"
          git push
