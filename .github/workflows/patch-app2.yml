name: patch-app-hourly-backtrack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: apply 6-hourly/hourly backtrack detail card
        run: |
          echo '' | base64 -d > /tmp/patch_app2.py
          python3 /tmp/patch_app2.py
      - name: commit
        run: |
          git config user.name "vayudrishti-nightly"
          git config user.email "actions@users.noreply.github.com"
          git add app/index.html
          if ! git diff --cached --quiet; then git commit -m "app: 6-hourly + expandable hourly backtrack detail (raw GFS vs ERA5 observed)"; git pull --rebase -q; git push; fi
