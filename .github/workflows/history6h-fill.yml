name: history6h-fill
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'first date to fill (YYYY-MM-DD)'
        required: true
      end:
        description: 'last date to fill (YYYY-MM-DD)'
        required: true
permissions:
  contents: write
concurrency:
  group: history6h-fill
  cancel-in-progress: false
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy eccodes
      - name: fill missing backtrack days (never overwrites existing rows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 history/hourly_fill.py "${{ inputs.start }}" "${{ inputs.end }}"
      - name: commit history files
        run: |
          git config user.name "vayudrishti-nightly"
          git config user.email "actions@users.noreply.github.com"
          git add app/history6h
          if ! git diff --cached --quiet; then git commit -m "history6h: hourly fill ${{ inputs.start }}..${{ inputs.end }}"; git pull --rebase -q; git push; fi
